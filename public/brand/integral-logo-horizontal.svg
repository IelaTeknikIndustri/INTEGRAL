<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4F46E5" />
            <stop offset="50%" stop-color="#6366F1" />
            <stop offset="100%" stop-color="#8B5CF6" />
        </linearGradient>
        <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#312E81" />
            <stop offset="100%" stop-color="#4F46E5" />
        </linearGradient>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- ICON GROUP -->
    <g transform="translate(15, 10)">
        <!-- Industrial Gear Outer Ring & Teeth -->
        <g stroke="url(#gearGrad)" stroke-width="4.5" fill="none" stroke-linejoin="round" opacity="0.85">
            <!-- Gear Teeth (8 teeth symmetrically arrayed around center 45, 50) -->
            <path d="M 45 22 L 51 22 L 53 29 L 58 31 L 64 26 L 68 30 L 63 36 L 65 41 L 72 43 L 72 49 L 65 51 L 63 56 L 68 62 L 64 66 L 58 61 L 53 63 L 51 70 L 45 70 L 43 63 L 38 61 L 32 66 L 28 62 L 33 56 L 31 51 L 24 49 L 24 43 L 31 41 L 33 36 L 28 30 L 32 26 L 38 31 L 43 29 Z" />
            <!-- Gear Center Bore -->
            <circle cx="48" cy="46" r="14" stroke="#4F46E5" stroke-width="3.5" />
        </g>

        <!-- Dynamic Integral Symbol Ribbon (I) -->
        <g filter="url(#softGlow)">
            <!-- Main Flowing Integral Curve -->
            <path d="M 68 12 C 58 12 49 19 46 32 L 40 60 C 37 73 30 80 18 80 L 16 80 C 13 80 11 77 12 74 L 14 66 C 14.5 64 16.5 63 18.5 63.5 C 26 65 31 61 33 52 L 39 24 C 42 11 51 4 67 4 L 70 4 C 73 4 75 7 74 10 L 72 18 C 71.5 20 69.5 21 67.5 20.5 C 62 19 58 21 57 28" 
                  fill="url(#primaryGrad)" />
            <!-- Integral Core Highlight Ribbon -->
            <path d="M 66 10 C 53 10 45 20 42 36 L 36 64 C 33 80 23 84 14 84" 
                  stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
        </g>

        <!-- Open Book Page Accent at bottom of Integral -->
        <path d="M 28 84 Q 44 80 60 84 Q 44 87 28 84 Z" fill="#6366F1" opacity="0.7"/>
    </g>

    <!-- TYPOGRAPHY GROUP -->
    <g transform="translate(115, 0)">
        <!-- "NTEGRAL" Bold Typography -->
        <text x="0" y="66" 
              font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="52" 
              font-weight="900" 
              letter-spacing="0.06em" 
              fill="#0F172A">
            NTEGRAL
        </text>

        <!-- Subtitle: "INDUSTRIAL INTEGRATED LIBRARY" -->
        <text x="3" y="90" 
              font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="11.5" 
              font-weight="700" 
              letter-spacing="0.24em" 
              fill="#4F46E5">
            INDUSTRIAL INTEGRATED LIBRARY
        </text>

        <!-- University Affiliation Tag -->
        <text x="3" y="106" 
              font-family="'JetBrains Mono', monospace" 
              font-size="9" 
              font-weight="600" 
              letter-spacing="0.18em" 
              fill="#64748B">
            TEKNIK INDUSTRI • UNIVERSITAS PGRI RONGGOLAWE
        </text>
    </g>
</svg>
