<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0E0725" />
            <stop offset="50%" stop-color="#180C3D" />
            <stop offset="100%" stop-color="#26135C" />
        </linearGradient>
        <linearGradient id="iconPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366F1" />
            <stop offset="50%" stop-color="#818CF8" />
            <stop offset="100%" stop-color="#C084FC" />
        </linearGradient>
        <linearGradient id="iconGearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4338CA" />
            <stop offset="100%" stop-color="#6366F1" />
        </linearGradient>
        <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Rounded Background Container -->
    <rect width="200" height="200" rx="44" fill="url(#bgGrad)" stroke="#312E81" stroke-width="2"/>

    <!-- Subtle Geometric Precision Lines in Background -->
    <circle cx="100" cy="100" r="70" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="100" cy="100" r="85" stroke="rgba(139, 92, 246, 0.1)" stroke-width="1" />

    <!-- Centered Gear & Integral Mark -->
    <g transform="translate(42, 38)">
        <!-- Industrial Gear Outer Ring & Teeth -->
        <g stroke="url(#iconGearGrad)" stroke-width="5.5" fill="none" stroke-linejoin="round" opacity="0.95">
            <path d="M 56 22 L 64 22 L 67 31 L 74 34 L 82 27 L 88 33 L 81 41 L 84 48 L 93 51 L 93 59 L 84 62 L 81 69 L 88 77 L 82 83 L 74 76 L 67 79 L 64 88 L 56 88 L 53 79 L 46 76 L 38 83 L 32 77 L 39 69 L 36 62 L 27 59 L 27 51 L 36 48 L 39 41 L 32 33 L 38 27 L 46 34 L 53 31 Z" />
            <circle cx="60" cy="55" r="18" stroke="#818CF8" stroke-width="4.5" />
        </g>

        <!-- Dynamic Integral Symbol Ribbon (I) -->
        <g filter="url(#emblemGlow)">
            <path d="M 85 10 C 72 10 61 19 57 36 L 50 72 C 46 88 37 98 22 98 L 19 98 C 15 98 13 94 14 90 L 17 80 C 17.5 78 20 77 22.5 77.5 C 32 79 38 74 41 63 L 48 29 C 52 13 63 4 83 4 L 87 4 C 91 4 93 8 92 12 L 90 22 C 89.5 24 87 25 84.5 24.5 C 77 23 72 25 71 34" 
                  fill="url(#iconPrimaryGrad)" />
            <path d="M 82 8 C 66 8 56 20 52 40 L 45 76 C 41 96 28 102 17 102" 
                  stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
        </g>
    </g>
</svg>
